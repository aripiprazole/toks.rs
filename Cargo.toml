[package]
name = "toks"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust bindings for toks: exact tokenizer ids, as fast as the hardware allows"
license = "Apache-2.0"
repository = "https://github.com/actual-computer/toks"
keywords = ["tokenizer", "bpe", "ffi", "llm"]
categories = ["api-bindings", "text-processing"]
links = "toks"
build = "build.rs"
include = [
    "/build.rs",
    "/src/**",
    "/tests/**",
    "/examples/**",
    # the submodule's library sources only (it also holds tests, docs and the python package)
    "/vendor/toks/include/**",
    "/vendor/toks/src/**",
    "/vendor/toks/Makefile",
    "/vendor/toks/LICENSE",
    "/vendor/toks/NOTICE",
    "/vendor/toks/LICENSING.md",
    "/vendor/toks/THIRD_PARTY_NOTICES.md",
]

[dependencies]
